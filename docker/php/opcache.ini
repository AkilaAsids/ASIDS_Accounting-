; OPcache — sized for a large modular monolith (thousands of classes).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.max_wasted_percentage = 10
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; Preloading is enabled only in the production image, where the source tree is
; immutable. The entrypoint rewrites the two directives below when APP_ENV is
; production: validate_timestamps=0 and the preload script path.
