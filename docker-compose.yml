name: asids-erp-cloud

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  env_file: [.env]
  volumes:
    - .:/var/www/html:cached
    - composer-cache:/home/asids/.composer/cache
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [asids]

services:
  # ── PHP-FPM application container ──────────────────────────────────────────
  app:
    <<: *app-base
    container_name: asids-app
    expose: ['9000']

  # ── HTTP front door ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: asids-nginx
    ports: ['80:80']
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [asids]

  # ── PostgreSQL 17 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: asids-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-asids_erp}
      # The bootstrap superuser. The application itself connects as
      # DB_USERNAME, a NOBYPASSRLS role created by the init script, so that
      # PostgreSQL row level security is actually enforced against it.
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-asids_owner}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-secret}
      APP_DB_USER: ${DB_USERNAME:-asids_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:-secret}
      TEST_DB_NAME: ${DB_DATABASE:-asids_erp}_testing
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - random_page_cost=1.1
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=250
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_ADMIN_USERNAME:-asids_owner} -d ${DB_DATABASE:-asids_erp}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [asids]

  # ── Redis (cache, sessions, queues, locks) ─────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: asids-redis
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [asids]

  # ── Meilisearch ────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: asids-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKeyChangeMe}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports: ['7700:7700']
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [asids]

  # ── Queue workers supervised by Horizon ────────────────────────────────────
  horizon:
    <<: *app-base
    container_name: asids-horizon
    command: ['php', 'artisan', 'horizon']
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD', 'php', 'artisan', 'horizon:status']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Scheduler ──────────────────────────────────────────────────────────────
  scheduler:
    <<: *app-base
    container_name: asids-scheduler
    command: ['php', 'artisan', 'schedule:work']

  # ── Front-end dev server ───────────────────────────────────────────────────
  vite:
    image: node:22-alpine
    container_name: asids-vite
    working_dir: /var/www/html
    command: ['sh', '-c', 'npm ci && npm run dev -- --host 0.0.0.0']
    ports: ['5173:5173']
    volumes:
      - .:/var/www/html:cached
      - node-modules:/var/www/html/node_modules
    networks: [asids]

  # ── Local mail catcher ─────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: asids-mailpit
    ports: ['1025:1025', '8025:8025']
    networks: [asids]

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  composer-cache:
  node-modules:

networks:
  asids:
    driver: bridge
