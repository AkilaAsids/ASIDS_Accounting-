; ASIDS ERP Cloud — PHP runtime tuning
; Applied on top of the php.ini-production defaults shipped with the image.

memory_limit = 512M
max_execution_time = 60
max_input_time = 60
post_max_size = 64M
upload_max_filesize = 32M
max_file_uploads = 30

; Financial arithmetic is performed with bcmath at a fixed scale; the default
; scale is set to zero so that every call must state its own precision and a
; silent rounding can never slip into a ledger amount.
bcmath.scale = 0

date.timezone = UTC
default_charset = UTF-8
mbstring.internal_encoding = UTF-8

; ── Error handling ──────────────────────────────────────────────────────────
; Never render errors to the response body; Laravel owns error presentation.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL
zend.exception_ignore_args = Off
zend.exception_string_param_max_len = 32

; ── Hardening ───────────────────────────────────────────────────────────────
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
enable_dl = Off
; `proc_open` is deliberately NOT disabled: Symfony Process depends on it, and
; the scheduler, Horizon's supervisors and the test runner all use Symfony
; Process. Every other shell escape is blocked.
disable_functions = exec,passthru,shell_exec,system,popen,pcntl_exec

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1

; Real-path caching keeps stat() traffic low on containerised filesystems.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
