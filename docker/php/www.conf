[www]
user = asids
group = asids

listen = 0.0.0.0:9000
listen.backlog = 4096

; Dynamic process management: the ERP has bursty request patterns (month-end
; reporting, payroll runs) so idle capacity is kept warm but bounded.
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 16
pm.max_requests = 500
pm.status_path = /fpm-status

; Surface slow requests with a stack trace so N+1 queries and unbounded report
; loops are caught in staging rather than by customers.
request_slowlog_timeout = 5s
slowlog = /dev/stderr
request_terminate_timeout = 120s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
