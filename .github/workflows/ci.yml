name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  # ── Static analysis of the PHP codebase ─────────────────────────────────────
  static-analysis:
    name: PHP static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, intl, pdo_pgsql, pgsql, redis, zip, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      # `--cache-file` points at a path inside the runner's per-job temporary directory, which is
      # created empty for every run and is not covered by the Composer cache above. Pint reuses a
      # cache when it finds one and reports a cached file as clean without re-reading it, so a cache
      # that outlived a rule or a PHP version change would let this gate pass on stale results. An
      # always-empty path makes every run a full check.
      - name: Check formatting (Pint)
        run: vendor/bin/pint --test --cache-file="${RUNNER_TEMP}/pint.cache"

      - name: Static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  # ── PHP test suite against a real PostgreSQL and Redis ──────────────────────
  php-tests:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: asids_erp_testing
          POSTGRES_USER: asids_owner
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U asids_owner"
          --health-interval=5s --health-timeout=5s --health-retries=20

      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, pdo_pgsql, pgsql, redis, zip, gd, pcntl
          coverage: pcov
          ini-values: pcov.directory=., memory_limit=1G
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Provision the RLS-enforced application role
        # Mirrors docker/postgres/init/01-bootstrap.sh so that the tenant
        # isolation tests exercise real row level security in CI.
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U asids_owner -d asids_erp_testing -v ON_ERROR_STOP=1 <<'SQL'
            CREATE EXTENSION IF NOT EXISTS citext;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE EXTENSION IF NOT EXISTS btree_gin;
            -- btree_gist backs the exclusion constraints that stop fiscal years and periods
            -- overlapping. Created here, as the superuser, so the migration that asks for it can
            -- run as the unprivileged application role and find it already present.
            CREATE EXTENSION IF NOT EXISTS btree_gist;
            DO $$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'asids_app') THEN
                CREATE ROLE asids_app LOGIN PASSWORD 'secret';
              END IF;
            END $$;
            ALTER ROLE asids_app NOSUPERUSER NOBYPASSRLS;
            GRANT USAGE, CREATE ON SCHEMA public TO asids_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE asids_owner IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO asids_app;
          SQL

      # Migrations run as `asids_app`, so that role owns the tables it creates.
      #
      # That ownership is what `RefreshDatabase` needs: PostgreSQL lets only a table's owner drop
      # it, and the suite drops and recreates the schema between tests. Run as `asids_owner`, the
      # tables belonged to the superuser and every test died on `must be owner of table`.
      #
      # Ownership does not weaken the isolation this job exists to prove. The policies are declared
      # `FORCE ROW LEVEL SECURITY`, which is precisely the clause that makes them apply to the
      # table's owner as well, and `asids_app` remains NOSUPERUSER NOBYPASSRLS — so it cannot
      # escape them by owning the table. A superuser could, which is why the previous arrangement
      # silently disabled tenant isolation for the whole suite.
      #
      # This also matches how developers run the suite locally, where `asids_app` owns the schema
      # and the RLS tests pass rather than skip.
      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: asids_erp_testing
          DB_USERNAME: asids_app
          DB_PASSWORD: secret
          DB_ADMIN_USERNAME: asids_owner
          DB_ADMIN_PASSWORD: secret
        run: php artisan migrate --force --no-interaction

      # `DB_USERNAME: asids_app` — not `asids_owner` — and the distinction is the whole point of the
      # provisioning step above. The service container's `asids_owner` is a superuser, and a
      # superuser bypasses row level security unconditionally: `FORCE ROW LEVEL SECURITY` does not
      # apply to it. Running the suite as the owner switched tenant isolation off for every test,
      # which is why `RowLevelSecurityTest` skipped its 11 assertions and `asids:security-check`
      # failed. `asids_app` is NOSUPERUSER NOBYPASSRLS, so the policies are genuinely in force and
      # those tests execute instead of skipping.
      #
      # Migrations above still run as `asids_owner`: they create the policies and the triggers, and
      # that needs ownership. Only the test run drops to the application role — which mirrors
      # production, where the application never connects as the owner.
      - name: Run Pest with coverage gate
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: asids_erp_testing
          DB_USERNAME: asids_app
          DB_PASSWORD: secret
          DB_ADMIN_USERNAME: asids_owner
          DB_ADMIN_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          TENANCY_ENFORCE_RLS: 'true'
        # `-d memory_limit=2G` is required, not precautionary. The suite itself runs comfortably
        # inside the default 128M, but building the coverage report loads every covered file's line
        # data at once and exhausts it — the run reports every test passing and then dies with a
        # fatal error while writing the report, so the job fails with no failing test to point at.
        run: php -d memory_limit=2G vendor/bin/pest --coverage --min=85 --ci

      # Here rather than in the front-end job because the route comparison needs a booted
      # application, and this is the job that has one. `--require-routes` turns "PHP was not
      # available so the comparison was skipped" into a failure: a check that can quietly
      # degrade to doing nothing is the reason the specification drifted in the first place.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check the OpenAPI specification against the routes
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: asids_erp_testing
          DB_USERNAME: asids_owner
          DB_PASSWORD: secret
        run: node scripts/check-openapi.mjs --require-routes

  # ── Front-end type checking, linting, unit tests and production build ───────
  frontend:
    name: Front-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  # ── Dependency and secret hygiene ───────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      # `--locked` audits composer.lock directly. This job deliberately does not run
      # `composer install` — it is a dependency-advisory check, not a runtime one, and installing
      # would add a minute for nothing. Without the flag `composer audit` looks for an installed
      # vendor directory, finds none, and exits 1 before auditing anything.
      - name: Composer advisory audit
        run: composer audit --locked --no-interaction --abandoned=report

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm advisory audit
        run: npm audit --audit-level=high

      - name: Verify no environment file was committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '::error::.env must never be committed.'
            exit 1
          fi

  # ── Single required status check ─────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-24.04
    needs: [static-analysis, php-tests, frontend, security]
    if: always()
    steps:
      - name: Fail if any upstream job failed
        run: |
          if [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = 'true' ]; then
            exit 1
          fi
