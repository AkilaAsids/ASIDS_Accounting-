; Xdebug is present in the development image but disabled unless XDEBUG_MODE is
; exported (for example: XDEBUG_MODE=debug docker compose up app).
xdebug.mode = ${XDEBUG_MODE}
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = ASIDS
xdebug.max_nesting_level = 512
xdebug.log_level = 0
