# ASIDS ERP Cloud — nginx virtual host.
#
# Serves the compiled SPA plus the JSON API. Wildcard `server_name` is required
# because every tenant is reached on its own subdomain (acme.asids.localhost).

map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64m;
    client_body_timeout 60s;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-Frame-Options           "DENY"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"              always;
    add_header X-Permitted-Cross-Domain-Policies "none"              always;
    server_tokens off;

    # ── Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript application/xml
               text/css text/plain text/xml image/svg+xml font/woff2;

    # ── Static assets ──────────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so the build directory is immutable.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Never expose dotfiles, sources or the FPM status page publicly.
    location ~ /\.(?!well-known).* { deny all; }
    location = /fpm-status        { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_param HTTPS           $forwarded_scheme;
        fastcgi_param REQUEST_SCHEME  $forwarded_scheme;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Any other .php path is an attempt to execute an uploaded or vendored file.
    location ~ \.php$ { return 404; }

    error_page 404 /index.php;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
